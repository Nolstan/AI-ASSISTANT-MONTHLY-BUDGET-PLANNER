<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw Funds | BudgetAI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/navbar.css">
    <style>
        :root {
            --paper: #EFEDE3;
            --paper-raised: #F7F5EC;
            --ink: #1F2A22;
            --ink-soft: #4B5A50;
            --rule: #D6D0BC;
            --green: #2F6F4E;
            --green-dark: #244F39;
            --danger: #A33B2D;
            --radius: 4px;
        }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); font-family: 'IBM Plex Sans', sans-serif; }
        h1, h2, h3 { font-family: 'Fraunces', serif; margin: 0; }
        a { color: inherit; text-decoration: none; }
        header { border-bottom: 1px solid var(--rule); background: var(--paper-raised); padding: 16px 28px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.25rem; }
        nav { display: flex; gap: 20px; font-size: 0.92rem; font-weight: 500; flex-wrap: wrap; }
        nav a:hover { color: var(--green); }
        nav a.active { color: var(--green); border-bottom: 2px solid var(--green); }
        .container { max-width: 600px; margin: 48px auto; padding: 0 24px; }
        .card { background: var(--paper-raised); border: 1px solid var(--rule); border-radius: var(--radius); padding: 32px; }
        .balance-box { background: var(--paper); border: 1px solid var(--rule); border-radius: var(--radius); padding: 24px; margin: 24px 0; text-align: center; }
        .balance-amount { font-family: 'IBM Plex Mono', monospace; font-size: 2.4rem; font-weight: 600; color: var(--green); margin-top: 8px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; color: var(--ink); }
        input[type="number"], input[type="text"], select {
            width: 100%;
            padding: 12px;
            font-family: 'IBM Plex Sans', sans-serif;
            font-size: 1rem;
            border: 1px solid var(--rule);
            border-radius: var(--radius);
            background: var(--paper);
            color: var(--ink);
        }
        input:focus, select:focus { outline: none; border-color: var(--green); }
        .btn { width: 100%; padding: 14px; background: var(--green); color: var(--paper-raised); border: none; border-radius: var(--radius); font-size: 1rem; font-weight: 600; cursor: pointer; font-family: 'IBM Plex Sans', sans-serif; }
        .btn:hover { background: var(--green-dark); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        #message { margin-top: 16px; text-align: center; font-size: 0.9rem; font-weight: 500; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><a href="dashboard.html">BudgetAI</a></div>
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav id="navMenu">
            <a href="dashboard.html">Dashboard</a>
            <a href="create-budget.html">Create Budget</a>
            <a href="release-schedule.html">Schedule</a>
            <a href="locked-budget.html">Locked Money</a>
            <a href="withdraw.html" class="active">Withdraw</a>
            <a href="transaction-history.html">Transactions</a>
        </nav>
    </header>

    <main class="container">
        <section class="card">
            <h1 style="text-align: center;">Withdraw Funds</h1>
            <p style="text-align: center; color: var(--ink-soft); margin-top: 8px;">Access your unlocked budget funds.</p>

            <div class="balance-box">
                <h3 style="font-size: 1rem; color: var(--ink-soft);">Available (Unlocked) Balance</h3>
                <div id="availableBalance" class="balance-amount">Loading...</div>
            </div>

            <form id="withdrawForm">
                <div class="form-group">
                    <label for="amount">Withdrawal Amount (MWK)</label>
                    <input type="number" id="amount" name="amount" min="1" step="0.01" placeholder="e.g. 50000" required>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <input type="text" id="category" name="category" placeholder="e.g. Groceries, Rent, Emergency" required>
                </div>
                
                <!-- users can add withdraws and it will be logged in the transaction history page -->

                <button type="submit" class="btn" id="withdrawBtn">Submit Withdrawal</button>
                <div id="message"></div>
            </form>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/withdraw.js"></script>
</body>
</html>
