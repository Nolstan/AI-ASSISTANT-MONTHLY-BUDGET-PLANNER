<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings | BudgetAI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #EFEDE3;
            --paper-raised: #F7F5EC;
            --ink: #1F2A22;
            --ink-soft: #4B5A50;
            --rule: #D6D0BC;
            --green: #2F6F4E;
            --green-dark: #244F39;
            --radius: 4px;
        }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); font-family: 'IBM Plex Sans', sans-serif; }
        h1, h2, h3 { font-family: 'Fraunces', serif; margin: 0; }
        a { color: inherit; text-decoration: none; }
        header { border-bottom: 1px solid var(--rule); background: var(--paper-raised); padding: 16px 28px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.25rem; }
        nav { display: flex; gap: 20px; font-size: 0.92rem; font-weight: 500; }
        nav a:hover { color: var(--green); }
        nav a.active { color: var(--green); border-bottom: 2px solid var(--green); }
        .container { max-width: 800px; margin: 32px auto; padding: 0 24px; }
        .card { background: var(--paper-raised); border: 1px solid var(--rule); border-radius: var(--radius); padding: 32px; margin-bottom: 24px; }
        .form-group { margin-bottom: 18px; display: flex; flex-direction: column; }
        .form-group label { font-size: 0.88rem; font-weight: 500; color: var(--ink-soft); margin-bottom: 6px; }
        .form-group input, .form-group select {
            font-family: 'IBM Plex Sans', sans-serif;
            padding: 10px 14px;
            font-size: 0.95rem;
            border: 1px solid var(--rule);
            border-radius: var(--radius);
            background: var(--paper);
            color: var(--ink);
        }
        .btn { padding: 10px 20px; background: var(--green); color: var(--paper-raised); border: none; border-radius: var(--radius); font-weight: 500; cursor: pointer; }
        .btn:hover { background: var(--green-dark); }
    </style>
</head>
<body>

    <header>
        <div class="logo"><a href="dashboard.html">BudgetAI</a></div>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="create-budget.html">Create Budget</a>
            <a href="ai-review.html">AI Review</a>
            <a href="approval.html">Approval</a>
            <a href="release-schedule.html">Schedule</a>
            <a href="locked-budget.html">Locked Money</a>
            <a href="transaction-history.html">Transactions</a>
            <a href="profile.html" class="active">Profile</a>
        </nav>
    </header>

    <main class="container">
        <section class="card">
            <h1>User Profile & Settings</h1>
            <p style="color: var(--ink-soft); margin-bottom: 24px;">Manage your account credentials, preferences, and automated AI settings.</p>

            <form id="profileForm">
                <h2>Account Details</h2>
                <div style="margin-top: 16px;">
                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" name="fullName" value="Jane Kariuki" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" value="jane@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="defaultCurrency">Preferred Currency</label>
                        <select id="defaultCurrency" name="defaultCurrency">
                            <option value="MWK" selected>MWK (K / MWK)</option>
                            <option value="USD">USD ($)</option>
                            <option value="EUR">EUR (€)</option>
                            <option value="GBP">GBP (£)</option>
                            <option value="KES">KES (KSh)</option>
                        </select>
                    </div>
                </div>

                <h2 style="margin-top: 28px;">AI & Lock Security Rules</h2>
                <div style="margin-top: 16px;">
                    <div class="form-group">
                        <label for="aiSensitivity">AI Budget Advisory Mode</label>
                        <select id="aiSensitivity" name="aiSensitivity">
                            <option value="balanced" selected>Balanced Advisory (Default)</option>
                            <option value="strict">Strict Savings Enforcer</option>
                            <option value="flexible">Flexible Spend Assistant</option>
                        </select>
                    </div>
                </div>

                <div style="margin-top: 24px;">
                    <button type="submit" class="btn">Save Profile Changes</button>
                </div>
            </form>
        </section>
    </main>

    <script src="js/api.js"></script>
</body>
</html>
