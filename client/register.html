<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account | BudgetAI</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <nav>

        <div class="logo">

            <a href="index.html">
                BudgetAI
            </a>

        </div>

    </nav>



    <main class="auth-container">

        <div class="auth-content">

            <h1>Create your account</h1>

            <p>

                Start planning your finances with AI.

            </p>


            <form id="registerForm">

                <div class="input-group">

                    <label>

                        Full Name

                    </label>

                    <input
                        type="text"
                        id="name"
                        required
                    >

                </div>



                <div class="input-group">

                    <label>

                        Email Address

                    </label>

                    <input
                        type="email"
                        id="email"
                        required
                    >

                </div>



                <div class="input-group">

                    <label>

                        Password

                    </label>

                    <input
                        type="password"
                        id="password"
                        required
                    >

                </div>



                <div class="input-group">

                    <label>

                        Confirm Password

                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        required
                    >

                </div>



                <button
                    type="submit"
                    class="primary-btn"
                >

                    Create Account

                </button>

            </form>



            <p class="bottom-text">

                Already have an account?

                <a href="login.html">

                    Login

                </a>

            </p>

        </div>

    </main>



    <script src="js/api.js"></script>

    <script src="js/register.js"></script>

</body>

</html>
