<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction History | BudgetAI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/navbar.css">
    <style>
        :root {
            --paper: #EFEDE3;
            --paper-raised: #F7F5EC;
            --ink: #1F2A22;
            --ink-soft: #4B5A50;
            --rule: #D6D0BC;
            --green: #2F6F4E;
            --green-dark: #244F39;
            --danger: #A33B2D;
            --radius: 4px;
        }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); font-family: 'IBM Plex Sans', sans-serif; }
        h1, h2, h3 { font-family: 'Fraunces', serif; margin: 0; }
        a { color: inherit; text-decoration: none; }
        header { border-bottom: 1px solid var(--rule); background: var(--paper-raised); padding: 16px 28px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.25rem; }
        nav { display: flex; gap: 20px; font-size: 0.92rem; font-weight: 500; }
        nav a:hover { color: var(--green); }
        nav a.active { color: var(--green); border-bottom: 2px solid var(--green); }
        .container { max-width: 1000px; margin: 32px auto; padding: 0 24px; }
        .card { background: var(--paper-raised); border: 1px solid var(--rule); border-radius: var(--radius); padding: 32px; }
        .filter-bar { display: flex; gap: 12px; margin: 20px 0; }
        .filter-bar input, .filter-bar select {
            font-family: 'IBM Plex Sans', sans-serif;
            padding: 9px 14px;
            border: 1px solid var(--rule);
            border-radius: var(--radius);
            background: var(--paper);
            color: var(--ink);
        }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--rule); }
        th { font-size: 0.85rem; color: var(--ink-soft); }
        td.mono { font-family: 'IBM Plex Mono', monospace; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.78rem; font-weight: 500; background: var(--paper); border: 1px solid var(--rule); }
    </style>
</head>
<body>

    <header>
        <div class="logo"><a href="dashboard.html">BudgetAI</a></div>
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav id="navMenu">
            <a href="dashboard.html">Dashboard</a>
            <a href="create-budget.html">Create Budget</a>
            <a href="ai-review.html">AI Review</a>
            <a href="approval.html">Approval</a>
            <a href="release-schedule.html">Schedule</a>
            <a href="locked-budget.html">Locked Money</a>
            <a href="withdraw.html">Withdraw</a>
            <a href="transaction-history.html" class="active">Transactions</a>
            <a href="profile.html">Profile</a>
        </nav>
    </header>

    <main class="container">
        <section class="card">
            <h1>Transaction History</h1>
            <p style="color: var(--ink-soft); margin-top: 6px;">View complete audit trail of income deposits, allocations, and expenditures.</p>

            <div class="filter-bar">
                <input type="text" placeholder="Search by merchant or keyword..." style="flex: 1;">
                <select>
                    <option value="">All Categories</option>
                    <option value="housing">Housing & Rent</option>
                    <option value="food">Food & Groceries</option>
                    <option value="income">Income</option>
                </select>
                <select>
                    <option value="all">All Dates</option>
                    <option value="july">July 2026</option>
                    <option value="june">June 2026</option>
                </select>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Description</th>
                        <th>Category</th>
                        <th>Type</th>
                        <th>Amount</th>
                    </tr>
                </thead>
                <tbody id="transactionsBody">
                    <tr>
                        <td colspan="5" style="text-align: center; color: var(--ink-soft); padding: 24px;">Loading transactions...</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/transaction-history.js"></script>
</body>
</html>
