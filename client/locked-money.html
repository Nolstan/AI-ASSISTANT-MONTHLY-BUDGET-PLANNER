<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locked Money | BudgetAI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/navbar.css">
    <style>
        :root {
            --paper: #EFEDE3;
            --paper-raised: #F7F5EC;
            --ink: #1F2A22;
            --ink-soft: #4B5A50;
            --rule: #D6D0BC;
            --green: #2F6F4E;
            --gold: #B8912B;
            --radius: 4px;
        }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); font-family: 'IBM Plex Sans', sans-serif; }
        h1, h2, h3 { font-family: 'Fraunces', serif; margin: 0; }
        a { color: inherit; text-decoration: none; }
        header { border-bottom: 1px solid var(--rule); background: var(--paper-raised); padding: 16px 28px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.25rem; }
        nav { display: flex; gap: 20px; font-size: 0.92rem; font-weight: 500; }
        nav a:hover { color: var(--green); }
        .container { max-width: 900px; margin: 32px auto; padding: 0 24px; }
        .card { background: var(--paper-raised); border: 1px solid var(--rule); border-radius: var(--radius); padding: 32px; }
        .btn { display: inline-block; padding: 12px 22px; background: var(--green); color: var(--paper-raised); border-radius: var(--radius); font-weight: 500; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><a href="dashboard.html">BudgetAI</a></div>
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav id="navMenu">
            <a href="dashboard.html">Dashboard</a>
            <a href="create-budget.html">Create Budget</a>
            <a href="ai-review.html">AI Review</a>
            <a href="approval.html">Approval</a>
            <a href="release-schedule.html">Schedule</a>
            <a href="locked-budget.html" class="active">Locked Money</a>
            <a href="transaction-history.html">Transactions</a>
            <a href="profile.html">Profile</a>
        </nav>
    </header>

    <main class="container">
        <section class="card">
            <h1>Locked Money Safe</h1>
            <p style="color: var(--ink-soft); margin: 12px 0 24px;">View your protected assets and emergency lock policies.</p>
            <a href="locked-budget.html" class="btn">Access Locked Assets Safe &rarr;</a>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/navbar.js"></script>
</body>
</html>
