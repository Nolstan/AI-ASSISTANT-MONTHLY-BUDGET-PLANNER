<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Interface | BudgetAI</title>

    <!-- Sleek High-Contrast Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">

    <!-- Motion & Vector Shader Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        :root {
            --bg-base: #080B11;
            --surface-glass: rgba(18, 24, 38, 0.65);
            --surface-border: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(255, 255, 255, 0.2);
            
            --text-primary: #F8FAFC;
            --text-muted: #64748B;
            
            --accent-emerald: #10B981;
            --accent-cyan: #06B6D4;
            --accent-violet: #8B5CF6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Reactive Canvas Background Layer */
        #fluid-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        /* Header Navigation */
        header {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 28px 64px;
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--surface-border);
        }

        .brand-logo {
            font-family: 'Syne', sans-serif;
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #FFF 40%, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Layout Container */
        .container {
            position: relative;
            z-index: 5;
            max-width: 1320px;
            margin: 50px auto;
            padding: 0 40px;
        }

        .dashboard-intro {
            margin-bottom: 40px;
        }

        .dashboard-intro h1 {
            font-family: 'Syne', sans-serif;
            font-size: 3.2rem;
            font-weight: 800;
            letter-spacing: -0.04em;
        }

        .dashboard-intro p {
            color: var(--text-muted);
            font-size: 1.05rem;
            margin-top: 8px;
        }

        /* Bento Grid Architecture */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
        }

        /* Studio Glass Card */
        .bento-card {
            background: var(--surface-glass);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid var(--surface-border);
            border-radius: 24px;
            padding: 32px;
            position: relative;
            overflow: hidden;
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
            cursor: pointer;
        }

        /* Radial Spotlight Overlay */
        .bento-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(500px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255, 255, 255, 0.08), transparent 40%);
            z-index: 1;
            pointer-events: none;
        }

        /* Edge Glare Effect */
        .bento-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 24px;
            padding: 1px;
            background: linear-gradient(135deg, var(--border-highlight), transparent 50%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .card-body {
            position: relative;
            z-index: 2;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-muted);
            font-weight: 700;
        }

        .card-metric {
            font-family: 'Syne', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.03em;
        }

        /* SVG Sparkline Graphs */
        .sparkline-container {
            margin-top: 20px;
            width: 100%;
            height: 48px;
        }

        .sparkline-path {
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Accent Colors */
        .emerald-text { color: var(--accent-emerald); }
        .cyan-text { color: var(--accent-cyan); }
        .violet-text { color: var(--accent-violet); }

        .btn-action {
            display: inline-flex;
            align-items: center;
            padding: 14px 28px;
            background: #FFFFFF;
            color: #000000;
            font-weight: 700;
            font-size: 0.9rem;
            border-radius: 100px;
            text-decoration: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <!-- Liquid Canvas Background -->
    <canvas id="fluid-canvas"></canvas>

    <header>
        <div class="brand-logo">BudgetAI Studio</div>
        <a href="create-budget.html" class="btn-action">+ New Allocation</a>
    </header>

    <main class="container">
        <section class="dashboard-intro">
            <h1>Capital Dashboard</h1>
            <p>Interactive liquidity monitoring & algorithmic allocation metrics.</p>
        </section>

        <section class="bento-grid">
            <div class="bento-card">
                <div class="card-body">
                    <div class="card-header">
                        <span class="card-title">Monthly Revenue</span>
                    </div>
                    <div id="totalMonthlyIncome" class="card-metric">MWK 0.00</div>
                    <div class="sparkline-container">
                        <svg viewBox="0 0 100 30" width="100%" height="100%">
                            <path class="sparkline-path" stroke="#FFFFFF" d="M0,25 Q25,10 50,18 T100,5" />
                        </svg>
                    </div>
                </div>
            </div>

            <div class="bento-card">
                <div class="card-body">
                    <div class="card-header">
                        <span class="card-title">Allocated Funds</span>
                    </div>
                    <div id="allocatedBudget" class="card-metric cyan-text">MWK 0.00</div>
                    <div class="sparkline-container">
                        <svg viewBox="0 0 100 30" width="100%" height="100%">
                            <path class="sparkline-path" stroke="#06B6D4" d="M0,20 Q25,28 50,12 T100,8" />
                        </svg>
                    </div>
                </div>
            </div>

            <div class="bento-card">
                <div class="card-body">
                    <div class="card-header">
                        <span class="card-title">Locked Encumbrances</span>
                    </div>
                    <div id="lockedMoney" class="card-metric violet-text">MWK 0.00</div>
                    <div class="sparkline-container">
                        <svg viewBox="0 0 100 30" width="100%" height="100%">
                            <path class="sparkline-path" stroke="#8B5CF6" d="M0,15 Q30,5 60,22 T100,12" />
                        </svg>
                    </div>
                </div>
            </div>

            <div class="bento-card">
                <div class="card-body">
                    <div class="card-header">
                        <span class="card-title">Net Available</span>
                    </div>
                    <div id="availableBalance" class="card-metric emerald-text">MWK 0.00</div>
                    <div class="sparkline-container">
                        <svg viewBox="0 0 100 30" width="100%" height="100%">
                            <path class="sparkline-path" stroke="#10B981" d="M0,28 Q25,15 50,10 T100,2" />
                        </svg>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        // --- 1. LIQUID CANVAS GRADIENT SHADER ---
        const canvas = document.getElementById('fluid-canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        let mouseX = width / 2;
        let mouseY = height / 2;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;

            // Update card spotlights
            document.querySelectorAll('.bento-card').forEach(card => {
                const rect = card.getBoundingClientRect();
                card.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`);
                card.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`);
            });
        });

        // Ambient fluid gradient simulation
        let time = 0;
        function renderFluid() {
            time += 0.01;
            ctx.clearRect(0, 0, width, height);

            // Dynamic Gradient Orbs
            const orb1X = mouseX * 0.2 + Math.sin(time) * 100 + width * 0.4;
            const orb1Y = mouseY * 0.2 + Math.cos(time) * 100 + height * 0.3;

            const orb2X = width * 0.7 - Math.cos(time * 0.8) * 80;
            const orb2Y = height * 0.6 + Math.sin(time * 0.8) * 80;

            // Orb 1: Cyan Glow
            const g1 = ctx.createRadialGradient(orb1X, orb1Y, 0, orb1X, orb1Y, 400);
            g1.addColorStop(0, 'rgba(6, 182, 212, 0.12)');
            g1.addColorStop(1, 'transparent');
            ctx.fillStyle = g1;
            ctx.fillRect(0, 0, width, height);

            // Orb 2: Violet Glow
            const g2 = ctx.createRadialGradient(orb2X, orb2Y, 0, orb2X, orb2Y, 500);
            g2.addColorStop(0, 'rgba(139, 92, 246, 0.1)');
            g2.addColorStop(1, 'transparent');
            ctx.fillStyle = g2;
            ctx.fillRect(0, 0, width, height);

            requestAnimationFrame(renderFluid);
        }
        renderFluid();

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // --- 2. SPRING PHYSICS CARD HOVER ---
        document.querySelectorAll('.bento-card').forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left - rect.width / 2;
                const y = e.clientY - rect.top - rect.height / 2;

                gsap.to(card, {
                    x: x * 0.08,
                    y: y * 0.08,
                    duration: 0.4,
                    ease: "power2.out"
                });
            });

            card.addEventListener('mouseleave', () => {
                gsap.to(card, {
                    x: 0,
                    y: 0,
                    duration: 0.8,
                    ease: "elastic.out(1, 0.4)"
                });
            });
        });
    </script>

    <!-- Keep backend integration connected -->
    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
