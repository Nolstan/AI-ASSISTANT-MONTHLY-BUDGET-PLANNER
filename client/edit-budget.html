<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Budget | BudgetAI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #EFEDE3;
            --paper-raised: #F7F5EC;
            --ink: #1F2A22;
            --ink-soft: #4B5A50;
            --rule: #D6D0BC;
            --green: #2F6F4E;
            --green-dark: #244F39;
            --danger: #A33B2D;
            --radius: 4px;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: var(--paper);
            color: var(--ink);
            font-family: 'IBM Plex Sans', sans-serif;
        }
        h1, h2, h3 { font-family: 'Fraunces', serif; margin: 0; }
        a { color: inherit; text-decoration: none; }
        header {
            border-bottom: 1px solid var(--rule);
            background: var(--paper-raised);
            padding: 16px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.25rem; }
        nav { display: flex; gap: 20px; font-size: 0.92rem; font-weight: 500; }
        nav a:hover { color: var(--green); }
        nav a.active { color: var(--green); border-bottom: 2px solid var(--green); }
        .container { max-width: 900px; margin: 32px auto; padding: 0 24px; }
        .card { background: var(--paper-raised); border: 1px solid var(--rule); border-radius: var(--radius); padding: 32px; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid var(--rule); }
        th { font-size: 0.85rem; color: var(--ink-soft); }
        input {
            font-family: 'IBM Plex Sans', sans-serif;
            padding: 8px 12px;
            font-size: 0.9rem;
            border: 1px solid var(--rule);
            border-radius: var(--radius);
            background: var(--paper);
            color: var(--ink);
            width: 100%;
        }
        .btn { padding: 10px 20px; background: var(--green); color: var(--paper-raised); border: none; border-radius: var(--radius); font-weight: 500; cursor: pointer; }
        .btn-danger { background: var(--danger); }
        .btn-outline { background: transparent; border: 1px solid var(--ink); color: var(--ink); }
    </style>
</head>
<body>

    <header>
        <div class="logo"><a href="dashboard.html">BudgetAI</a></div>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="create-budget.html">Create Budget</a>
            <a href="ai-review.html">AI Review</a>
            <a href="approval.html">Approval</a>
            <a href="release-schedule.html">Schedule</a>
            <a href="locked-budget.html">Locked Money</a>
            <a href="transaction-history.html">Transactions</a>
            <a href="profile.html">Profile</a>
        </nav>
    </header>

    <main class="container">
        <section class="card">
            <h1>Edit Budget Plan</h1>
            <p style="color: var(--ink-soft); margin-top: 6px;">Modify line items, reallocate amounts, or add new budget categories.</p>

            <form id="editBudgetForm">
                <table>
                    <thead>
                        <tr>
                            <th>Category Name</th>
                            <th>Allocated Amount (MWK)</th>
                            <th>Lock Strategy</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="budgetRows">
                        <tr>
                            <td><input type="text" value="Housing & Rent" name="category_0"></td>
                            <td><input type="number" value="1500000.00" name="amount_0" step="0.01"></td>
                            <td>
                                <select name="lock_0" style="padding: 8px; border: 1px solid var(--rule); background: var(--paper); border-radius: var(--radius);">
                                    <option value="due_date" selected>Due Date</option>
                                    <option value="unlocked">Unlocked</option>
                                    <option value="strict">Strict Lock</option>
                                </select>
                            </td>
                            <td><button type="button" class="btn btn-danger" style="padding: 6px 12px; font-size: 0.8rem;">Remove</button></td>
                        </tr>
                        <tr>
                            <td><input type="text" value="Food & Groceries" name="category_1"></td>
                            <td><input type="number" value="600000.00" name="amount_1" step="0.01"></td>
                            <td>
                                <select name="lock_1" style="padding: 8px; border: 1px solid var(--rule); background: var(--paper); border-radius: var(--radius);">
                                    <option value="weekly" selected>Weekly Release</option>
                                    <option value="unlocked">Unlocked</option>
                                </select>
                            </td>
                            <td><button type="button" class="btn btn-danger" style="padding: 6px 12px; font-size: 0.8rem;">Remove</button></td>
                        </tr>
                    </tbody>
                </table>

                <div style="margin-bottom: 24px;">
                    <button type="button" class="btn btn-outline" style="font-size: 0.88rem;">+ Add Category</button>
                </div>

                <div style="display: flex; gap: 12px; align-items: center;">
                    <button type="submit" class="btn">Save & Re-evaluate Plan</button>
                    <a href="dashboard.html" style="color: var(--ink-soft); font-size: 0.9rem;">Cancel Changes</a>
                </div>
            </form>
        </section>
    </main>

    <script src="js/api.js"></script>
</body>
</html>
