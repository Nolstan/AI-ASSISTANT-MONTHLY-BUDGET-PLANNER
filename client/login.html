<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in | BudgetAI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --paper: #EFEDE3;
    --paper-raised: #F7F5EC;
    --ink: #1F2A22;
    --ink-soft: #4B5A50;
    --rule: #D6D0BC;
    --green: #2F6F4E;
    --green-dark: #244F39;
    --danger: #A33B2D;
    --radius: 4px;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }

  h1{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0;
  }

  a{ color: inherit; text-decoration: none; }

  /* ---------- Header ---------- */
  header{
    border-bottom: 1px solid var(--rule);
    padding: 22px 28px;
  }
  header nav a{
    font-family:'Fraunces', serif;
    font-weight: 600;
    font-size: 1.15rem;
  }

  /* ---------- Auth layout ---------- */
  main{
    flex: 1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 48px 20px;
  }

  main section{
    width: 100%;
    max-width: 400px;
    background: var(--paper-raised);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    padding: 40px 36px 32px;
    box-shadow: 0 1px 0 var(--rule), 0 24px 48px -32px rgba(31,42,34,0.35);
  }

  main section > h1{
    font-size: 1.7rem;
  }

  main section > p:first-of-type{
    margin: 10px 0 28px;
    color: var(--ink-soft);
    font-size: 0.95rem;
    line-height: 1.5;
  }

  /* ---------- Form ---------- */
  form div{
    margin-bottom: 18px;
    display: flex;
    flex-direction: column;
  }

  form label{
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--ink-soft);
    margin-bottom: 7px;
  }

  form input{
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.95rem;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    padding: 11px 14px;
    transition: border-color .15s ease, box-shadow .15s ease;
  }

  form input::placeholder{ color: #9A9686; }

  form input:hover{ border-color: var(--ink-soft); }

  form input:focus{
    outline: none;
    border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(47,111,78,0.14);
  }

  form input:invalid:not(:placeholder-shown){
    border-color: var(--danger);
  }

  form button{
    width: 100%;
    margin-top: 8px;
    padding: 13px 18px;
    background: var(--green);
    color: var(--paper-raised);
    border: none;
    border-radius: var(--radius);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.98rem;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s ease, transform .15s ease;
  }

  form button:hover{ background: var(--green-dark); }
  form button:active{ transform: translateY(1px); }

  main section > p:last-of-type{
    text-align: center;
    margin: 24px 0 0;
    font-size: 0.9rem;
    color: var(--ink-soft);
  }

  main section > p:last-of-type a{
    color: var(--green-dark);
    font-weight: 500;
    border-bottom: 1px solid transparent;
  }
  main section > p:last-of-type a:hover{ border-bottom-color: var(--green-dark); }

  @media (max-width: 460px){
    main section{ padding: 32px 24px 26px; }
  }

  :focus-visible{
    outline: 2px solid var(--green);
    outline-offset: 2px;
  }
</style>
</head>
<body>

<header>
    <nav>
        <a href="index.html">BudgetAI</a>
    </nav>
</header>

<main>
    <section>
        <h1>Log in to your account</h1>
        <p>Welcome back! Please enter your details.</p>

        <form id="loginForm">
            <div>
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" placeholder="jane@example.com" required>
            </div>

            <div>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit">Log in</button>
        </form>

        <p>
            Don't have an account? <a href="register.html">Sign up</a>
        </p>
    </section>
</main>

<script src="js/api.js"></script>
<script src="js/login.js"></script>
</body>
</html>
